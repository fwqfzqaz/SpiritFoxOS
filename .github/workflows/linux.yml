name: Linux build and boot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'archlinux:base-devel']
    container: ${{ matrix.image }}
    steps:
      - name: Prepare checkout tools
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
          else
            pacman -Syu --noconfirm --needed git ca-certificates
          fi
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          if command -v pacman >/dev/null; then
            pacman -S --noconfirm --needed base-devel nasm binutils gptfdisk mtools dosfstools qemu-system-x86 edk2-ovmf python python-pillow meson ninja pkgconf expat wayland git curl xz file gdb
          else
            bash tools/install-deps.sh
          fi
      - name: Build and boot from clean sources
        shell: bash
        run: |
          # Container UID and checkout owner can differ; trust only this job's checkout.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/check-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ strategy.job-index }}
          path: build/*.log
